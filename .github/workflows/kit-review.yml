name: Review

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

# One job, not one per reviewer. A skipped job reports success to a required
# status check, and a false green on the merge gate is worse than a false red,
# so whether a reviewer applies is decided by the shell and never by an `if:`
# on a job.
jobs:
  claude-review:
    name: claude-review
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The issue number comes from the branch name, which the guards constrain
      # to <prefix><number>-<slug>. A maintenance branch carries no issue, so
      # the acceptance audit does not apply there.
      - name: Resolve the issue under review
        id: issue
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -a; . .claude/kit.vars; set +a
          NUMBER=""
          case "$BRANCH" in
            "$KIT_ISSUE_BRANCH_PREFIX"*)
              NUMBER=$(printf '%s' "${BRANCH#$KIT_ISSUE_BRANCH_PREFIX}" | cut -d- -f1) ;;
          esac
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
          echo "issue under review: ${NUMBER:-none}"

      # The files the change actually touches. The gate compares this list
      # against what each reviewer claims to have read, which turns "did the
      # review happen" from a model claim into a checkable fact.
      - name: List the changed files
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only "$BASE" "$HEAD" | sort > changed-files.txt
          echo "files in this change:"
          cat changed-files.txt

      # Single task, no delegation. Subagent dispatch from inside this action is
      # unreliable, so the criteria are read from their file instead. The action
      # restores that file from the protected branch, so a pull request cannot
      # weaken the criteria it is judged by.
      - name: Code review
        id: code
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            You are reviewing a pull request in ${{ github.repository }}.

            The review criteria are written in .claude/agents/code-reviewer.md.
            Read that file and apply exactly the criteria it states, including
            its definition of what counts as a blocking finding.

            The change is the diff between ${{ github.event.pull_request.base.sha }}
            and ${{ github.event.pull_request.head.sha }}. The files it touches
            are listed in changed-files.txt.

            Return your verdict as structured output. List in files_reviewed
            only files that this diff touches. List in files_consulted anything
            else you read to reach your verdict, such as project documentation.
            Do not write any file.
          claude_args: |
            --max-turns 80
            --allowedTools Read,Grep,Glob,Bash
            --json-schema '{"type":"object","properties":{"verdict":{"type":"string","enum":["pass","fail"]},"files_reviewed":{"type":"array","items":{"type":"string"}},"files_consulted":{"type":"array","items":{"type":"string"}},"blocking_findings":{"type":"array","items":{"type":"object","properties":{"file":{"type":"string"},"description":{"type":"string"}},"required":["file","description"]}},"summary":{"type":"string"}},"required":["verdict","files_reviewed","files_consulted","blocking_findings","summary"]}'

      # The turns a reviewer uses vary from run to run and grow with the size of
      # the change and the number of criteria. Running out of turns fails the
      # step, and the gate refuses, so both reviewers get the same wide limit.
      - name: Acceptance audit
        id: acceptance
        if: steps.issue.outputs.number != ''
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            You are auditing a pull request in ${{ github.repository }} against
            the acceptance criteria of issue #${{ steps.issue.outputs.number }}.

            The audit criteria are written in .claude/agents/acceptance-auditor.md.
            Read that file and apply exactly the criteria it states, including
            its rule that reading code is not evidence.

            Read the issue with: gh issue view ${{ steps.issue.outputs.number }}

            Return your verdict as structured output. List in files_reviewed
            only files that this diff touches. List in files_consulted anything
            else you read to reach your verdict. Do not write any file.
          claude_args: |
            --max-turns 80
            --allowedTools Read,Grep,Glob,Bash
            --json-schema '{"type":"object","properties":{"verdict":{"type":"string","enum":["pass","fail"]},"files_reviewed":{"type":"array","items":{"type":"string"}},"files_consulted":{"type":"array","items":{"type":"string"}},"blocking_findings":{"type":"array","items":{"type":"object","properties":{"file":{"type":"string"},"description":{"type":"string"}},"required":["file","description"]}},"summary":{"type":"string"}},"required":["verdict","files_reviewed","files_consulted","blocking_findings","summary"]}'

      # The gate. Every rule here is decided by this shell, never by the model.
      # Values arrive through the environment rather than ${{ }} interpolation,
      # because that substitution happens before bash sees the script.
      - name: Enforce the verdicts
        if: always()
        env:
          CODE_CONCLUSION: ${{ steps.code.outputs.conclusion }}
          CODE_OUTPUT: ${{ steps.code.outputs.structured_output }}
          AUDIT_APPLIES: ${{ steps.issue.outputs.number != '' }}
          AUDIT_CONCLUSION: ${{ steps.acceptance.outputs.conclusion }}
          AUDIT_OUTPUT: ${{ steps.acceptance.outputs.structured_output }}
        run: |
          set -u
          STATUS=0

          # A reviewer passes only when all five conditions hold. Any missing or
          # inconsistent answer is a refusal, never a pass.
          judge() {
            local label="$1" conclusion="$2" payload="$3"
            local verdict blocking reviewed unknown

            if [ "$conclusion" != "success" ]; then
              echo "FAIL  $label: the run did not complete (conclusion=${conclusion:-none})"
              return 1
            fi
            if [ -z "$payload" ]; then
              echo "FAIL  $label: no structured output was produced"
              return 1
            fi
            if ! printf '%s' "$payload" | jq -e . >/dev/null 2>&1; then
              echo "FAIL  $label: the structured output is not valid JSON"
              return 1
            fi

            verdict=$(printf '%s' "$payload" | jq -r '.verdict // empty')
            blocking=$(printf '%s' "$payload" | jq -r '.blocking_findings | length')
            reviewed=$(printf '%s' "$payload" | jq -r '.files_reviewed | length')

            printf '%s' "$payload" | jq -r '.summary // empty' | sed "s/^/      /"
            printf '%s' "$payload" | jq -r '.blocking_findings[] | "      [blocking] \(.file) - \(.description)"'

            # Evidence: a review that names no file, or names files this change
            # does not touch, did not read this change. A leading / or ./ is
            # dropped first: it names the same file, and a path outside the
            # diff is still refused after that.
            if [ "$reviewed" -eq 0 ]; then
              echo "FAIL  $label: no file was reported as reviewed"
              return 1
            fi
            unknown=$(printf '%s' "$payload" | jq -r '.files_reviewed[] | sub("^\\.?/"; "")' | sort \
                      | comm -23 - changed-files.txt | tr '\n' ' ')
            if [ -n "${unknown// /}" ]; then
              echo "FAIL  $label: reported files outside this change: $unknown"
              return 1
            fi

            # Coverage, reported and not enforced yet: changed files the code
            # reviewer did not name. Binary assets are left out, and the
            # acceptance auditor is exempt because it reads per criterion.
            if [ "$label" = "code review" ]; then
              missing=$(printf '%s' "$payload" | jq -r '.files_reviewed[] | sub("^\\.?/"; "")' | sort -u \
                        | comm -13 - changed-files.txt \
                        | { grep -vE '\.(png|gif|jpe?g|svg|ico)$' || true; } | tr '\n' ' ')
              if [ -n "${missing// /}" ]; then
                echo "WARN  $label: changed files not reported as reviewed: $missing"
              fi
            fi

            # Consistency: the verdict has to agree with the findings.
            if [ "$verdict" = "pass" ] && [ "$blocking" -gt 0 ]; then
              echo "FAIL  $label: verdict pass with $blocking blocking finding(s)"
              return 1
            fi
            if [ "$verdict" = "fail" ] && [ "$blocking" -eq 0 ]; then
              echo "FAIL  $label: verdict fail with no blocking finding"
              return 1
            fi
            if [ "$verdict" != "pass" ]; then
              echo "FAIL  $label: verdict is $verdict"
              return 1
            fi

            echo "PASS  $label: $reviewed file(s) reviewed, no blocking finding"
            return 0
          }

          echo "--- code review"
          judge "code review" "$CODE_CONCLUSION" "$CODE_OUTPUT" || STATUS=1

          echo "--- acceptance audit"
          if [ "$AUDIT_APPLIES" = "true" ]; then
            judge "acceptance audit" "$AUDIT_CONCLUSION" "$AUDIT_OUTPUT" || STATUS=1
          else
            echo "PASS  acceptance audit: no issue on this branch, not applicable"
          fi

          exit "$STATUS"